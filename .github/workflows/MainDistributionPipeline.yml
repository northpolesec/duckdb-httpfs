#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      extension_name: httpfs
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata

  code-quality:
    name: Code Quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      extension_name: httpfs
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extra_toolchains: 'python3'
      format_checks: 'format'

  release:
    name: Release extension binaries
    # Every push to the default branch publishes its Linux builds, tagged with the DuckDB version and commit
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: duckdb-stable-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DUCKDB_VERSION: v1.5.4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: httpfs-${{ env.DUCKDB_VERSION }}-extension-linux_*
          path: artifacts

      - name: Publish release
        run: |
          set -euo pipefail
          tag="${DUCKDB_VERSION}-${GITHUB_SHA::7}"
          mkdir release
          for arch in linux_amd64 linux_arm64; do
            cp "artifacts/httpfs-${DUCKDB_VERSION}-extension-${arch}/httpfs.duckdb_extension" \
              "release/httpfs-${DUCKDB_VERSION}-${arch}.duckdb_extension"
          done
          (cd release && sha256sum *.duckdb_extension > SHA256SUMS)
          # A re-run of the same commit replaces the assets
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "httpfs $tag" \
              --notes "httpfs for DuckDB ${DUCKDB_VERSION}, built from ${GITHUB_SHA}. Unsigned: DuckDB must be opened with allow_unsigned_extensions."
          fi
